name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 20.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure npm auth for GitHub Packages
        if: ${{ env.GH_PACKAGES_TOKEN != '' }}
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          {
            echo "@webstir-io:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}"
          } >> "$NPMRC"

      - name: Install workspace dependencies
        run: npm ci --workspaces

      - name: Build testing contract package
        run: npm --workspace Framework/Contracts/testing-contract run build

      - name: Build module contract package
        run: npm --workspace Framework/Contracts/module-contract run build

      - name: Build backend package
        run: npm --workspace Framework/Backend run build

      - name: Build frontend package
        run: npm --workspace Framework/Frontend run build

      - name: Ensure sharp linux-x64 vendor binding
        run: |
          env npm_config_platform=linux npm_config_arch=x64 \
            npm install --no-save @img/sharp-linux-x64 @img/sharp-libvips-linux-x64
          SHARP_IGNORE_GLOBAL_LIBVIPS=1 \
            env npm_config_platform=linux npm_config_arch=x64 \
            npm rebuild sharp --foreground-scripts --verbose || true

      - name: Build testing package
        run: npm --workspace Framework/Testing run build

      - name: Build solution
        run: dotnet build Webstir.sln -v minimal

      - name: Run .NET workflow tests (Full)
        run: WEBSTIR_TEST_MODE=full dotnet test Tester/Tester.csproj --nologo --logger "console;verbosity=minimal;summary=true"

      - name: Run frontend package tests
        run: npm --workspace Framework/Frontend test --silent

      - name: Resolve bump type
        id: resolve_bump
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            if (eventName !== 'workflow_dispatch') {
              core.info('Non-dispatch release; defaulting bump to patch.');
              return 'patch';
            }

            const input = context.payload.inputs?.bump ?? 'auto';
            if (input !== 'auto') {
              core.info(`Using bump type '${input}' from workflow input.`);
              return input;
            }

            const commitSha = process.env.GITHUB_SHA;
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha
            });

            const priorities = [
              { label: 'release:major', bump: 'major' },
              { label: 'release:minor', bump: 'minor' },
              { label: 'release:patch', bump: 'patch' }
            ];

            for (const { label, bump } of priorities) {
              const hasLabel = response.data.some(pr =>
                Array.isArray(pr.labels) && pr.labels.some(item => item.name === label)
              );
              if (hasLabel) {
                core.info(`Derived bump '${bump}' from PR label '${label}'.`);
                return bump;
              }
            }

            core.info('No release labels found on associated PRs; defaulting bump to patch.');
            return 'patch';
          result-encoding: string

      - name: Determine release version
        id: release_version
        shell: bash
        env:
          RESOLVED_BUMP: ${{ steps.resolve_bump.outputs.result }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            BUMP="${RESOLVED_BUMP:-patch}"
            VERSION=$(dotnet run --project Framework/Framework.csproj -- packages bump --all --bump "$BUMP" --print-version | tail -n 1)
            echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          else
            REF_NAME="${GITHUB_REF_NAME}"
            VERSION="${REF_NAME#v}"
            echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Push release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git tag -f "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.release_version }}
          name: Webstir v${{ steps.release_version.outputs.release_version }}
