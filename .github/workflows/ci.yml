name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build testing contract package
        run: bun run --cwd Framework/Contracts/testing-contract build

      - name: Build module contract package
        run: bun run --cwd Framework/Contracts/module-contract build

      - name: Build backend package
        run: bun run --cwd Framework/Backend build

      - name: Build frontend package
        run: bun run --cwd Framework/Frontend build

      - name: Build testing package
        run: bun run --cwd Framework/Testing build

      - name: Build solution
        run: dotnet build Webstir.sln -v minimal

      - name: Run .NET workflow tests (Full)
        run: WEBSTIR_TEST_MODE=full dotnet test Tester/Tester.csproj --nologo --logger "console;verbosity=minimal;summary=true"

      - name: Run frontend package tests
        run: bun run --cwd Framework/Frontend test

      - name: Build framework packages
        run: dotnet run --project Framework/Framework.csproj -- packages sync
