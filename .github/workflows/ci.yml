name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node 20.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: |
            Framework/Frontend/package-lock.json
            Framework/Testing/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Framework/Frontend

      - name: Install testing dependencies
        run: npm ci
        working-directory: Framework/Testing

      - name: Build solution
        run: dotnet build Webstir.sln -v minimal

      - name: Run .NET workflow tests
        run: WEBSTIR_TEST_MODE=full dotnet test Tester/Tester.csproj --nologo --logger "console;verbosity=minimal;summary=true"

      - name: Dump Webstir logs on failure
        if: ${{ failure() }}
        run: |
          LOG_DIR="$HOME/.webstir/logs"
          if [ -d "$LOG_DIR" ]; then
            echo "---- webstir logs ----"
            ls -lah "$LOG_DIR"
            echo
            for file in "$LOG_DIR"/*.log; do
              echo "----- $file -----"
              cat "$file"
              echo
            done
          else
            echo "No log directory at $LOG_DIR"
          fi

      - name: Run frontend package tests
        run: npm test --silent
        working-directory: Framework/Frontend

      - name: Build framework packages
        run: dotnet run --project Framework/Framework.csproj -- packages sync

      - name: Verify framework packages
        run: dotnet run --project Framework/Framework.csproj -- packages verify
