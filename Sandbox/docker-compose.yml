name: webstir-sandbox

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      # Mount the published client assets produced by `webstir publish`
      # Expected structure: dist/client/pages/<name>/index.html, etc.
      - ../CLI/out/seed/dist/client:/usr/share/nginx/html
      # Serve app utilities from published dist (router, navigation) without maps
      - ../CLI/out/seed/dist/client/app:/usr/share/nginx/html/app:ro
      # Provide an nginx site config that supports clean URLs if needed
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - webstir

  api:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "build/server/index.js"]
    environment:
      # Match Webstir template server expectations
      - PORT=8000
      - WEB_SERVER_URL=http://web
      - API_SERVER_URL=http://api:8000
    volumes:
      # Mount a compiled Node server from the seed project
      - ../CLI/out/seed:/app:ro
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - webstir

networks:
  webstir:
    driver: bridge
