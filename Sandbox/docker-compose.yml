name: webstir-sandbox

services:
  registry:
    image: verdaccio/verdaccio:5
    restart: unless-stopped
    ports:
      - "4873:4873"
    volumes:
      - registry-storage:/verdaccio/storage
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    networks:
      - webstir

  npmrc:
    build:
      context: ./npmrc
    depends_on:
      registry:
        condition: service_started
    restart: "no"
    environment:
      - NPM_USERNAME=webstir
      - NPM_PASSWORD=webstir
      - NPM_EMAIL=dev@local.test
      - NPM_SCOPE=@webstir
      - NPM_REGISTRY=http://registry:4873
      - HOST_NPMRC_DIR=/host-npmrc
    volumes:
      - ./npmrc:/out
      - ${NPMRC_HOST_DIR:-./npmrc/host}:/host-npmrc
    networks:
      - webstir

  publisher:
    image: node:20.19.2-alpine3.22
    restart: "no"
    depends_on:
      registry:
        condition: service_started
      npmrc:
        condition: service_completed_successfully
    working_dir: /workspace
    command: ["sh", "/workspace/utilities/npm-publisher.sh"]
    environment:
      - NPM_REGISTRY=http://registry:4873
      - FRONTEND_PACKAGE=@webstir/frontend
      - FRONTEND_DIR=framework/frontend
      - TEST_PACKAGE=@webstir/test
      - TEST_DIR=framework/testing
      - NPM_USERCONFIG=/npmrc/host/.npmrc
      - NPMRC_FALLBACK=/workspace/Sandbox/npmrc/host/.npmrc
      - WORKSPACE=/workspace
    volumes:
      - ..:/workspace
      - ./npmrc:/npmrc
    networks:
      - webstir

  certs:
    build:
      context: ./mkcert
    restart: "no"
    environment:
      - OUT=/out
    volumes:
      - ./certs:/out
    networks:
      - webstir

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      certs:
        condition: service_completed_successfully
      api:
        condition: service_started
      publisher:
        condition: service_completed_successfully
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # Mount the published frontend assets produced by `webstir publish`
      # Expected structure: dist/frontend/pages/<name>/index.html, etc.
      - ../CLI/out/seed/dist/frontend:/usr/share/nginx/html
      # Serve shared app scripts from published dist
      - ../CLI/out/seed/dist/frontend/app:/usr/share/nginx/html/app:ro
      # Provide an nginx site config that supports clean URLs + brotli
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
      # Mount self-signed TLS certs (generate via Sandbox/generate-certs.sh)
      - ./certs:/etc/nginx/certs:ro
    networks:
      - webstir

  api:
    image: node:20.19.2-alpine3.22
    working_dir: /app
    command: ["node", "build/backend/index.js"]
    environment:
      # Match Webstir template server expectations
      - PORT=8000
      - WEB_SERVER_URL=http://web
      - API_SERVER_URL=http://api:8000
    volumes:
      # Mount a compiled Node server from the seed project
      - ../CLI/out/seed:/app:ro
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - webstir
    depends_on:
      publisher:
        condition: service_completed_successfully

networks:
  webstir:
    driver: bridge

volumes:
  registry-storage:
